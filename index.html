<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONOFUEGO</title>
<meta name="description" content="MONOFUEGO — domo y estudios en Guanacaste, Costa Rica.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="fonts/GrenettePro-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/GrenettePro-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{
    font-family:"Grenette Pro";
    src:url("fonts/GrenettePro-Regular.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Grenette Pro";
    src:url("fonts/GrenettePro-SemiBold.ttf") format("truetype");
    font-weight:600;
    font-style:normal;
    font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    font-family:"Grenette Pro",Georgia,"Times New Roman",serif;
    text-align:center;
    padding:24px;
  }
  h1{
    animation:aparecer 1.6s ease both;
  }
  h1 img{
    display:block;
    width:min(82vw,640px);
    height:auto;
  }
  p{
    font-weight:400; /* Grenette Pro Regular */
    font-size:clamp(.8rem,2.4vw,1rem);
    letter-spacing:.45em;
    margin-right:-.45em;
    text-transform:uppercase;
    color:#fff;
    animation:aparecer 1.6s .5s ease both;
  }
  @keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){h1,p{animation:none}}
</style>
</head>
<body>
  <h1><img
    src="assets/monofuego-logo-1280.png"
    srcset="assets/monofuego-logo-640.png 640w, assets/monofuego-logo-1280.png 1280w, assets/monofuego-logo.png 1921w"
    sizes="min(82vw, 640px)"
    alt="MONOFUEGO" width="1921" height="445" fetchpriority="high"></h1>
  <p>GUANACASTE • COSTA RICA</p>
</body>
</html>
