<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONOFUEGO</title>
<meta name="description" content="MONOFUEGO — domo y estudios en Guanacaste, Costa Rica. Muy pronto.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    text-align:center;
    padding:24px;
  }
  h1{
    font-size:clamp(2.2rem,9vw,5rem);
    font-weight:700;
    letter-spacing:.28em;
    margin-right:-.28em; /* compensa el tracking para centrar de verdad */
    animation:aparecer 1.6s ease both;
  }
  p{
    font-size:clamp(.8rem,2.4vw,1rem);
    letter-spacing:.45em;
    margin-right:-.45em;
    text-transform:uppercase;
    color:#9a9a9a;
    animation:aparecer 1.6s .5s ease both;
  }
  @keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){h1,p{animation:none}}
</style>
</head>
<body>
  <h1>MONOFUEGO</h1>
  <p>Muy pronto · Coming soon</p>
</body>
</html>
